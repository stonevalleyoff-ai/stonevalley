<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STONE VALLEY</title>
<meta name="description" content="Stone Valley — une île vivante, en isométrie et en première personne.">
<meta name="theme-color" content="#161a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stone Valley">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  html,body{margin:0;height:100%;background:#161a26;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#cfd6e4;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  canvas{display:block;position:absolute;inset:0;}
  #c3{display:none;pointer-events:none;}
  .ui{position:fixed;z-index:2;pointer-events:none;}
  #hud{top:calc(60px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));font-size:13px;letter-spacing:.5px;line-height:1.7;
    text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #hud b{color:#ffd27d;font-weight:600;}
  #msg{top:32%;left:0;right:0;text-align:center;font-size:20px;letter-spacing:3px;
    text-transform:uppercase;color:#ffd27d;opacity:0;transition:opacity .35s;
    text-shadow:0 3px 10px rgba(0,0,0,.7);}
  /* L'encoche et la barre d'accueil des iPhone : on écarte les boutons des bords sûrs. */
  #rot{top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:flex;gap:8px;}
  #rot button,#pad button{pointer-events:auto;background:rgba(22,26,38,.72);
    border:1px solid rgba(190,205,230,.28);color:#cfd6e4;border-radius:10px;
    font:inherit;font-size:15px;cursor:pointer;backdrop-filter:blur(3px);}
  #rot button{width:40px;height:40px;}
  #pad{left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;
    padding:0 calc(18px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left));align-items:flex-end;}
  #stick{pointer-events:auto;width:118px;height:118px;border-radius:50%;
    border:1px solid rgba(190,205,230,.22);background:rgba(22,26,38,.4);position:relative;}
  #knob{position:absolute;width:46px;height:46px;border-radius:50%;left:36px;top:36px;
    background:rgba(200,215,240,.5);border:1px solid rgba(255,255,255,.35);}
  #rot button:active{background:rgba(255,210,125,.35);}
  /* Les jauges du coin : vie, mana, souffle. Le souffle pâlit quand il est plein. */
  #jauges{display:grid;gap:4px;width:190px;margin-bottom:5px;}
  .jg{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1px;color:#8d9ab4;}
  .jg>span{width:50px;flex:none;}
  .jg .br{flex:1;height:8px;border-radius:4px;background:rgba(22,26,38,.65);border:1px solid rgba(190,205,230,.22);overflow:hidden;}
  .jg .br i{display:block;height:100%;width:100%;border-radius:3px;}
  .jg em{font-style:normal;color:#e8a0a8;width:22px;flex:none;}
  #j-vie i{background:#e8505e;} #j-mana i{background:#5aa0e8;} #endu i{background:#ffd27d;}
  #endu{transition:opacity .5s;} #endu.sec i{background:#ff8a7a;}
  /* La boussole : une bande qui défile sous le regard, avec ce qu'on cherche dessus. */
  #boussole{top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:34px;
    width:min(460px,calc(100vw - 440px));border-radius:8px;background:rgba(22,26,38,.55);
    border:1px solid rgba(190,205,230,.22);overflow:hidden;}
  #boussole canvas{position:static;inset:auto;width:100%;height:100%;}
  @media (max-width:760px){
    #boussole{top:calc(56px + env(safe-area-inset-top));width:calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));}
    #hud{top:calc(98px + env(safe-area-inset-top)) !important;}
  }
  /* Les cinq cases, au bord droit : un appui utilise ce qu'elles portent. */
  #cases{right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;}
  #cases button{pointer-events:auto;position:relative;width:48px;height:48px;padding:0;border-radius:10px;cursor:pointer;
    background:rgba(22,26,38,.72);border:1px solid rgba(190,205,230,.28);backdrop-filter:blur(3px);}
  #cases button.vide{opacity:.35;}
  #cases button.on{border-color:#ffd27d;box-shadow:inset 0 0 0 1px #ffd27d;}
  #cases button.faible .ic{opacity:.35;}
  #cases button:active{background:rgba(255,210,125,.35);}
  #cases .ic,#bsac .ic{display:block;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated;}
  #cases .ic{position:absolute;left:8px;top:8px;width:32px;height:32px;}
  #cases kbd,#combat kbd,#bsac kbd{position:absolute;left:5px;top:3px;font-size:9px;font-family:inherit;color:#8d9ab4;display:none;}
  #cases em{position:absolute;right:3px;bottom:1px;font-size:9px;font-style:normal;color:#8fc4ff;}
  @media (hover:hover) and (pointer:fine){ #cases kbd,#combat kbd,#bsac kbd{display:block;} }
  /* Le combat, en bas à droite : sauter, frapper, et l'action du moment. */
  #combat{right:calc(68px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:172px;height:160px;}
  #combat button,#bsac{pointer-events:auto;position:absolute;background:rgba(22,26,38,.72);border:1px solid rgba(190,205,230,.28);
    color:#cfd6e4;font-family:inherit;cursor:pointer;backdrop-filter:blur(3px);letter-spacing:1px;padding:0;}
  #bj{right:0;bottom:0;width:78px;height:78px;border-radius:50%;font-size:12px;}
  #batt{right:90px;bottom:2px;width:74px;height:74px;border-radius:50%;font-size:10px;letter-spacing:.2px !important;border-color:rgba(255,150,130,.5) !important;}
  #bact{right:2px;bottom:88px;width:74px;height:62px;border-radius:14px;font-size:10px;letter-spacing:.2px !important;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  #bact b{font-weight:600;color:#ffd27d;} #bact.vide b{color:#6d778d;}
  #bact span{font-size:9px;color:#8d9ab4;max-width:68px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.2px;}
  #combat button:active,#bsac:active{background:rgba(255,210,125,.35);}
  #cible{position:absolute;right:0;bottom:158px;width:164px;padding:6px 8px 7px;border-radius:9px;font-size:11px;line-height:1.35;
    background:rgba(22,26,38,.72);border:1px solid rgba(190,205,230,.22);}
  #cible b{font-weight:600;color:#ffd68a;} #cible.lie b{color:#e8a0a8;} #cible.meca b{color:#8fe3ff;}
  #cible .br{height:6px;margin:4px 0 3px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden;}
  #cible .br i{display:block;height:100%;background:#e8505e;}
  #cible small{display:block;color:#8d9ab4;font-size:10px;}
  #bsac{position:fixed !important;left:calc(18px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;gap:1px;}
  #bsac .ic{width:28px;height:28px;}
  #tip{bottom:calc(4px + env(safe-area-inset-bottom));left:160px;right:340px;text-align:center;font-size:10px;line-height:1.5;color:#6d778d;}
  @media (hover:none),(max-width:900px){#tip{display:none;}}
  /* La porte : ce que voit un joueur avant d'entrer dans l'île. */
  #porte{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#1d2434 0%,#10131c 70%);padding:18px;overflow:auto;}
  #porte.parti{display:none;}
  #porte .carte{width:min(370px,100%);background:rgba(20,24,35,.92);border:1px solid rgba(190,205,230,.18);
    border-radius:16px;padding:22px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.5);}
  #porte h1{margin:0 0 2px;font-size:23px;letter-spacing:5px;color:#ffd27d;text-align:center;font-weight:600;}
  #porte .sous{margin:0 0 16px;text-align:center;color:#8b95aa;font-size:12.5px;letter-spacing:.4px;}
  #porte label{display:block;font-size:11px;color:#8b95aa;margin:0 0 9px;letter-spacing:.3px;}
  #porte input{width:100%;box-sizing:border-box;margin-top:4px;background:rgba(0,0,0,.32);
    border:1px solid rgba(190,205,230,.28);border-radius:9px;color:#e3e8f3;font:inherit;font-size:15px;padding:9px 10px;}
  #porte input:focus{outline:2px solid #ffd27d;outline-offset:1px;}
  #porte button{font:inherit;cursor:pointer;border-radius:9px;}
  #porte .principal{width:100%;margin-top:6px;padding:11px;background:#ffd27d;border:0;color:#241a06;
    font-weight:650;letter-spacing:.4px;font-size:15px;}
  #porte .principal:disabled{opacity:.55;cursor:default;}
  #porte .liens{display:flex;justify-content:space-between;gap:10px;margin-top:12px;}
  #porte .liens button{background:none;border:0;color:#9fb0cd;font-size:12.5px;padding:4px 2px;text-decoration:underline;}
  #porte .msg{min-height:17px;margin:2px 0 6px;font-size:12.5px;line-height:1.45;color:#ef8a6f;}
  #porte .msg.bien{color:#9fd08a;}
  #porte .note{margin:14px 0 0;font-size:11px;color:#6f788f;}
  #sac{pointer-events:auto;inset:0;z-index:10;display:none;background:rgba(8,10,16,.72);
    --nuit:#10131c;--rail:#0c0f16;--trait:#1f2432;--roche:#2b303c;--roche-b:#07090e;
    --texte:#e3e8f3;--texte2:#8b95aa;--or:#ffd27d;--pousse:#9fd08a;--braise:#ef8a6f;--lien:#e8404e;
    font-size:13px;line-height:1.5;color:var(--texte);}
  #sac.on{display:flex;}
  #sac button{font:inherit;color:inherit;cursor:pointer;}
  #sac button:focus-visible,#sac input:focus-visible{outline:2px solid var(--or);outline-offset:2px;}
  #sac .ic{display:block;flex:none;background-repeat:no-repeat;background-position:center;
    background-size:100% 100%;image-rendering:pixelated;}
  #sac h2,#sac h3,#sac h4{text-transform:none;letter-spacing:.2px;}
  #sac h3{margin:12px 0 7px;font-size:12px;font-weight:600;color:var(--texte2);}
  /* Presque opaque, pas tout à fait : un calque plein écran totalement opaque fait cesser au
     navigateur de dessiner le jeu dessous, et la reprise à la fermeture a pu figer l'image. */
  .sac-cadre{display:flex;flex:1;min-width:0;min-height:0;background:rgba(16,19,28,.97);}
  @media (min-width:1040px) and (min-height:620px){
    #sac.on{align-items:center;justify-content:center;}
    .sac-cadre{flex:0 1 980px;height:min(640px,calc(100% - 48px));border:1px solid var(--trait);
      border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);}
  }
  .sac-rail{flex:none;width:86px;display:flex;flex-direction:column;gap:2px;padding:10px 6px;
    background:var(--rail);border-right:1px solid var(--trait);}
  .sac-rail button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border:0;
    border-radius:9px;background:none;color:var(--texte2);font-size:11px;line-height:1.2;}
  .sac-rail button .ic{width:32px;height:32px;opacity:.5;}
  .sac-rail button:hover .ic{opacity:.8;}
  .sac-rail button.on{background:#191e2b;color:var(--texte);box-shadow:inset 3px 0 0 var(--or);}
  .sac-rail button.on .ic{opacity:1;}
  #sac .sac-rail button:focus-visible{outline-offset:-2px;}
  .sac-rail .fermer{margin-top:auto;font-size:17px;padding:10px 0;}
  .sac-page{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;}
  .sac-tete{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px 9px;border-bottom:1px solid var(--trait);}
  .sac-tete h2{margin:0;font-size:18px;font-weight:650;color:var(--texte);}
  .badge{font-size:11px;font-weight:650;color:#2a1d05;background:var(--or);border-radius:4px;padding:1px 7px;}
  .jauges{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .vies{display:flex;gap:2px;}
  .vies .ic{width:14px;height:14px;}
  .vies .ic.eteint{filter:grayscale(1) brightness(.45);}
  .jauge{display:flex;align-items:center;gap:6px;}
  .jauge .ic{width:16px;height:16px;}
  .barre{display:block;width:78px;height:7px;background:#070910;border-radius:2px;overflow:hidden;
    box-shadow:inset 0 0 0 1px #1d2230;}
  .barre i{display:block;height:100%;}
  .barre.vie i{background:linear-gradient(#f08a96,#c8404e);}
  .barre.mana i{background:linear-gradient(#aef2f5,#3fa6b4);}
  .sac-corps{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 18px;}
  .sac-corps.deux{display:grid;grid-template-columns:minmax(210px,36%) minmax(0,1fr);gap:0 24px;
    overflow:hidden;padding-bottom:0;}
  .sac-corps.deux>.col{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px;}
  .sac-corps.etabli{grid-template-columns:minmax(230px,42%) minmax(0,1fr);}
  .case{--t:52px;position:relative;flex:none;width:var(--t);height:var(--t);display:grid;place-items:center;
    padding:0;border:0;border-radius:5px;background:var(--grain,none) 0 0/32px 32px,var(--roche);
    box-shadow:inset 0 2px 0 var(--roche-b),inset 0 0 0 1px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.05);}
  .case .ic{width:calc(var(--t) - 16px);height:calc(var(--t) - 16px);}
  .case.mini{--t:36px;}
  .case.mini .ic{width:24px;height:24px;}
  .case.grande{--t:84px;}
  .case.grande .ic{width:64px;height:64px;}
  .case .nb{position:absolute;right:3px;bottom:0;font-size:12px;font-weight:700;color:#fff;
    font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;}
  .case.porte{box-shadow:inset 0 0 0 2px var(--or),inset 0 3px 0 var(--roche-b),0 0 14px rgba(255,210,125,.16);}
  .case.choisie{outline:2px solid var(--texte);outline-offset:2px;}
  .case.vide .ic{opacity:.16;filter:grayscale(1) brightness(1.7);}
  button.case:hover{filter:brightness(1.18);}
  .case.neuf{animation:neuf .8s ease-out;}
  @keyframes neuf{from{box-shadow:0 0 0 0 rgba(255,210,125,.9),inset 0 0 0 2px var(--or);}
    to{box-shadow:0 0 0 16px rgba(255,210,125,0),inset 0 0 0 2px var(--or);}}
  @media (prefers-reduced-motion:reduce){.case.neuf{animation:none;}}
  .equip{display:grid;grid-template-columns:repeat(3,max-content);gap:8px 14px;}
  .rangee{display:flex;flex-wrap:wrap;gap:8px 10px;}
  .emplacement{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--texte2);}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,52px);gap:8px;}
  .fiche{display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:1px solid var(--trait);}
  .fiche.haute{margin-top:10px;padding-top:0;border-top:0;}
  .fiche.calme{display:block;color:var(--texte2);}
  .fiche-texte{min-width:0;}
  .fiche-texte h4{margin:0 0 2px;font-size:16px;font-weight:650;color:var(--texte);}
  .fiche-texte p{margin:0 0 6px;color:var(--texte2);}
  .genre{font-size:11px;color:var(--texte2);border:1px solid var(--trait);border-radius:4px;padding:0 6px;}
  .carac{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 2px;color:var(--texte2);font-size:12px;}
  .carac b{color:var(--texte);font-weight:650;font-variant-numeric:tabular-nums;}
  .gestes{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px;}
  .gestes.cases{gap:6px;margin-top:8px;}
  .gestes.cases .btn{min-width:34px;padding:0 9px;}
  .gestes.cases .btn[aria-pressed="true"]{border-color:var(--or);color:var(--or);box-shadow:inset 0 0 0 1px var(--or);}
  .note{font-size:11.5px;color:var(--texte2);}
  .note.manque{color:var(--braise);}
  .btn{border-radius:7px;padding:7px 14px;font-size:13px;font-weight:650;background:#1b2130;border:1px solid #394154;}
  .btn:hover{background:#232a3a;}
  .btn.principal{background:var(--or);border-color:var(--or);color:#2a1d05;}
  .btn.principal:hover{background:#ffdd9a;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.principal:disabled{background:#161b27;border-color:#2c3344;color:#687186;opacity:1;}
  .vide-texte{display:flex;flex-direction:column;align-items:flex-start;gap:8px;color:var(--texte2);}
  .filtres{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 6px;}
  .filtres button{border-radius:999px;padding:3px 11px;font-size:12px;background:none;border:1px solid var(--trait);color:var(--texte2);}
  .filtres button.on{background:#20263a;border-color:#4a5372;color:var(--texte);}
  .recettes{list-style:none;margin:0;padding:0;}
  .recette{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:10px;align-items:center;width:100%;
    text-align:left;background:none;border:0;border-radius:7px;padding:5px 8px 5px 6px;}
  .recette .case{grid-row:1 / 4;}
  .recette .nom{font-weight:600;line-height:1.25;}
  .recette .etat{font-size:11.5px;color:var(--texte2);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recette.faisable .etat{color:var(--pousse);}
  .recette.faite .etat{color:var(--or);}
  .recette:hover{background:#151a25;}
  .recette.choisie{background:#1a1f2d;box-shadow:inset 3px 0 0 var(--or);}
  .progres{display:block;height:3px;margin-top:3px;background:#1d2230;border-radius:2px;overflow:hidden;}
  .progres i{display:block;height:100%;background:#6b7590;}
  .recette.faisable .progres i{background:var(--pousse);}
  .ingredients{list-style:none;margin:0;padding:0;display:grid;gap:7px;}
  .ingredients li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;}
  .ingr-nom{display:flex;flex-direction:column;gap:3px;}
  .ingr-nom .barre{width:100%;max-width:200px;height:4px;}
  .ingredients li.ok .barre i{background:var(--pousse);}
  .ingredients li.manque .barre i{background:var(--braise);}
  .qte{font-variant-numeric:tabular-nums;font-weight:650;}
  .ingredients li.manque .qte{color:var(--braise);}
  .sac-corps.lignes{max-width:780px;}
  #sac .obj{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 2px;
    border-bottom:1px solid var(--trait);}
  #sac .obj.porte{background:linear-gradient(90deg,rgba(255,210,125,.10),transparent 70%);
    box-shadow:inset 3px 0 0 var(--or);padding-left:12px;}
  #sac .obj .n{color:var(--texte);font-weight:600;}
  #sac .obj .d{color:var(--texte2);font-size:12px;}
  #sac .obj .d::first-letter{text-transform:uppercase;}
  #sac .obj button{flex:none;border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:650;
    background:#1b2130;border:1px solid #394154;white-space:nowrap;}
  #sac .obj button:hover{background:#232a3a;}
  #sac .obj button:disabled{opacity:.38;cursor:default;}
  .touches{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;margin:0;}
  .touches dt{color:var(--texte);font-weight:600;}
  .touches dd{margin:0;color:var(--texte2);}
  /* les compagnes : une ligne par lien, le rouge du lien pour celles qui sont dehors */
  .case.lie{box-shadow:inset 0 0 0 2px var(--lien),inset 0 3px 0 var(--roche-b),0 0 14px rgba(232,64,78,.18);}
  .case.ko .ic{filter:grayscale(.85) brightness(.6);}
  .compte{font-weight:400;color:var(--texte2);margin-left:4px;}
  .liens{list-style:none;margin:0;padding:0;display:grid;gap:3px;}
  .lien-ligne{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;row-gap:1px;align-items:center;
    width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:5px 8px 5px 5px;}
  .lien-ligne .case{grid-row:1 / 4;}
  .lien-ligne .nom{font-weight:600;line-height:1.25;}
  .lien-ligne .etat{font-size:11.5px;color:var(--texte2);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lien-ligne .progres{max-width:180px;}
  .lien-ligne.libre .nom{color:var(--texte2);font-weight:500;}
  .lien-ligne:hover{background:#151a25;}

<script>
(() => {
'use strict';
// ============================================================
//  ÎLE DE PIERRE — moteur isométrique
//  Le monde est une grille de cubes unitaires. On les projette en
//  orthographique, on les trie en profondeur, et on ne dessine que
//  les faces visibles. La caméra tourne : c'est indispensable en
//  isométrie, où le relief cache toujours quelque chose.
// ============================================================
const cv = document.getElementById('c'), g = cv.getContext('2d');
const TW = 34, ZH = 25.4;                 // demi-largeur au sol, et hauteur d'un cube à plat
let TH = 17, TZ = 22;                     // recalculés depuis l'inclinaison
// Trois inclinaisons de caméra. Ce n'est pas cosmétique : à 16° on lit les façades
// et le relief vertical, à 50° on lit le plan au sol. Les deux servent.
const ELEVS = [{ a: 16 * Math.PI/180, n: 'RASANTE' }, { a: 30 * Math.PI/180, n: 'ISO' }, { a: 50 * Math.PI/180, n: 'PLONGÉE' }];
let elevIdx = 1, elev = ELEVS[1].a, elevT = elev;
// Le monde ne change pas d'un pouce : seule la caméra change. En isométrie on projette
// en orthographique, en première personne en perspective depuis l'œil du personnage.
let mode = 'iso';
let yaw = Math.PI * .25, pitch = -0.05;
const EYE = 0.58, NEAR = 0.06;
function setProjection() {
  TH = TW * Math.sin(elev);               // le plan au sol s'écrase avec sin(inclinaison)
  TZ = ZH * Math.cos(elev);               // la hauteur se dresse avec cos(inclinaison)
}
setProjection();
let Wd = 0, Hd = 0, dpr = 1;
// Le décor prévient quand il change — dalle conjurée ou dissipée, pied coupé ou repoussé.
// La 1re personne en WebGL garde ses tronçons de décor en mémoire : elle doit savoir
// lesquels refaire, sans relire toute l'île à chaque image.
let crochetDecor = null;
let isoGL = true;                                    // l'isométrie passe aussi par la carte graphique
function signalDecor(quoi, i) { if (crochetDecor) crochetDecor(quoi, i); }

// ---------- le niveau ----------
// ---------- le monde : une carte de hauteurs procédurale, ouverte ----------
// Rien ne change pour la physique : elle interroge toujours hAt() et solid().
// Seule la provenance des hauteurs change — bruit au lieu de chaînes écrites à la main.
const WS = 200;                                     // colonnes de côté
const Hgt = new Uint8Array(WS * WS), Bio = new Uint8Array(WS * WS);
// Seconde couche : les plateformes flottantes. Une carte de hauteurs ne sait décrire qu'une
// altitude par case, donc rien qui ait du vide dessous. On garde donc, par case, la dalle
// suspendue qui la survole : son dessous et son dessus. PlT vaut 0 quand il n'y a rien.
// Une seule dalle par case suffit pour des îles volantes et ne coûte que deux octets.
const PlB = new Uint8Array(WS * WS), PlT = new Uint8Array(WS * WS);
const plaT = (x, y) => (x < 0 || y < 0 || x >= WS || y >= WS) ? 0 : PlT[y * WS + x];
const plaB = (x, y) => (x < 0 || y < 0 || x >= WS || y >= WS) ? 0 : PlB[y * WS + x];
const BIOME = [
  { n: 'eau',      top: [46, 92, 140],   side: [34, 66, 104],  food: 0 },
  { n: 'rivage',   top: [222, 206, 158], side: [178, 160, 118], food: .12 },
  { n: 'prairie',  top: [122, 178, 96],  side: [120, 92, 60],   food: 1 },
  { n: 'bois',     top: [62, 118, 74],   side: [92, 70, 48],    food: .82 },
  { n: 'lande',    top: [186, 172, 110], side: [146, 130, 84],  food: .38 },
  { n: 'falaise',  top: [124, 116, 108], side: [96, 88, 82],    food: .05 },
  { n: 'pierre',   top: [172, 176, 188], side: [126, 130, 144], food: .08 },
  { n: 'neige',    top: [236, 240, 248], side: [188, 196, 212], food: .03 },
  { n: 'vide',     top: [14, 13, 22],    side: [30, 26, 40],   food: 0 },   // le fond des gouffres
];
function mkNoise(seed) {
  let st = seed >>> 0;
  const rnd = () => (st = (st * 1664525 + 1013904223) >>> 0) / 4294967296;
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  const P = new Uint8Array(512); for (let i = 0; i < 512; i++) P[i] = p[i & 255];

    const x0 = Math.floor(x), y0 = Math.floor(y), fx = fd(x - x0), fy = fd(y - y0);
    const a2 = vl(x0, y0), b2 = vl(x0 + 1, y0), c2 = vl(x0, y0 + 1), d2 = vl(x0 + 1, y0 + 1);

  };
}
function fbm(n, x, y, oc) { let a = 1, f = 1, s2 = 0, nm = 0; for (let i = 0; i < oc; i++) { s2 += a * n(x * f, y * f); nm += a; a *= .5; f *= 2; } return s2 / nm; }
// La graine de l'île vient de la copie locale s'il y en a une : on retrouve la même île.
// Une copie par compte : deux joueurs sur le même navigateur ne se marchent pas dessus.
const SESSION_CLE = 'stone_valley_session';
function sessionGardee() {
  try { return JSON.parse(localStorage.getItem(SESSION_CLE) || 'null'); } catch (e) { return null; }
}
function nomCopie(uid) { return 'stone_valley' + (uid ? ':' + uid : ''); }
// Le nom de la copie suit le compte : au premier passage il est encore sans nom, entrer() le fixe.
let STOCKAGE = nomCopie((sessionGardee() || {}).uid);
function graineSauvee() {
  try {
    const s = JSON.parse(localStorage.getItem(STOCKAGE) || 'null');
    const g = s && s.donnees && s.donnees.graine;
    return Number.isInteger(g) ? g : null;
  } catch (e) { return null; }
}
// La profondeur de l'expédition se lit en même temps que la graine, avant que le monde ne se
// peuple : c'est elle qui dit combien de chasseurs l'île doit porter.
function expSauvee() {
  try {
    const s = JSON.parse(localStorage.getItem(STOCKAGE) || 'null');
    const e = s && s.donnees && s.donnees.exp;
    if (!e) return null;
    const n = Number.isFinite(e.n) ? e.n : e.s;        // « s » : l'ancien nom, du temps des sauts
    if (!Number.isFinite(n)) return null;
    return { niveau: Math.max(0, Math.min(99, n | 0)), coeurs: Math.max(0, Math.min(3, e.c | 0)),
      sortie: e.s === 1 || e.sortie === 1 ? 1 : 0 };
  } catch (e) { return null; }
}
const SEED = graineSauvee() ?? ((Math.random() * 1e9) | 0);
const nA = mkNoise(SEED), nB = mkNoise(SEED ^ 0x9e37), nC = mkNoise(SEED ^ 0x51ed);
const MAXH = 24;                                     // relief bien plus marqué qu'avant
// Ombrage du terrain, calculé une fois. Trois composantes qui se cumulent :
//  - la pente (fausse normale tirée du gradient) — sans elle, toutes les faces du dessus
//    ont la même normale et donc la même teinte : le relief devient invisible d'en haut ;
//  - l'ombre portée, en remontant le rayon du soleil sur la carte de hauteurs ;
//  - l'occlusion, qui assombrit les creux entourés de reliefs plus hauts.
const Sh = new Float32Array(WS * WS);
const SUN_AZ = 2.36, SUN_EL = .68;                   // soleil bas, venant du nord-ouest
const SUNX = Math.cos(SUN_AZ) * Math.cos(SUN_EL), SUNY = Math.sin(SUN_AZ) * Math.cos(SUN_EL), SUNZ = Math.sin(SUN_EL);
// Couleur de l'horizon, dont dépendent le ciel et le brouillard. Elle suit le jour : le
// brouillard doit toujours virer vers ce que l'on voit derrière, sinon il se voit.
function couleurCiel() {
  const l = clarte();
  return [30 + 118 * l, 38 + 126 * l, 58 + 118 * l];
}
// Sans perspective atmosphérique, une falaise à trente cases a le même contraste qu'une à
// deux, et toute la profondeur s'écrase. On fond donc vers l'horizon avec la distance.
const BRU0 = 11, BRU1 = 30, BRU_MAX = .72;
// L'abîme ne prend qu'un tiers de la brume. Sans rien du tout il gardait exactement la même
// noirceur à trois cases et à trente, pendant que tout le reste s'estompait : une forme noire
// absolue au fond d'un paysage pâle ne se lit pas comme un trou dans le MONDE, mais comme un
// trou dans l'IMAGE. Avec un tiers, il recule comme le reste sans cesser d'être le plus sombre.
function brumeAbime(c, d) {
  const f = brumeF(d) * .35, k = couleurCiel();
  return [c[0] + (k[0] - c[0]) * f, c[1] + (k[1] - c[1]) * f, c[2] + (k[2] - c[2]) * f];
}
function brumeF(d) {
  const b1 = BRU0 + (BRU1 - BRU0) * met('brume');      // couvert : l'horizon se rapproche
  return Math.min(BRU_MAX, Math.max(0, (d - BRU0) / (b1 - BRU0)) * BRU_MAX);
}
function brume(c, d) {
  const f = Math.min(BRU_MAX, Math.max(0, (d - BRU0) / (BRU1 - BRU0)) * BRU_MAX);
  if (f <= 0) return c;
  const k = couleurCiel();
  return [c[0] + (k[0] - c[0]) * f, c[1] + (k[1] - c[1]) * f, c[2] + (k[2] - c[2]) * f];
}
function calcOmbrage() {
  // Uniquement l'éclairement de la pente, doux et continu. L'ombre portée binaire et
  // l'occlusion sur voisinage produisaient des taches à bords durs et du moucheté :
  // du bruit, pas de la lisibilité. Le relief sera souligné autrement, par des arêtes nettes.
  for (let y = 0; y < WS; y++) for (let x = 0; x < WS; x++) {
    const i = y * WS + x;
    const dzx = (hAt(x + 1, y) - hAt(x - 1, y)) * .5, dzy = (hAt(x, y + 1) - hAt(x, y - 1)) * .5;
    const nl = Math.hypot(dzx, dzy, 1);
    const lam = Math.max(0, (-dzx * SUNX - dzy * SUNY + SUNZ) / nl);
    Sh[i] = .68 + .32 * lam;
  }
}
function genWorld() {
  const tmp = new Float32Array(WS * WS);
  for (let y = 0; y < WS; y++) for (let x = 0; x < WS; x++) {
    const u = x / WS, v = y / WS;
    // Déformation du domaine : on déplace les coordonnées avec un second bruit avant
    // d'échantillonner. C'est ce qui casse l'aspect « bulles » et donne des côtes sinueuses.
    const wx = x + fbm(nC, x / 70, y / 70, 3) * 34 - 17;
    const wy = y + fbm(nC, x / 70 + 99, y / 70 + 55, 3) * 34 - 17;
    const base = fbm(nA, wx / 62, wy / 62, 5);
    // Crêtes : le bruit replié sur lui-même produit des arêtes au lieu de dômes.
    let cr = 1 - Math.abs(fbm(nB, wx / 78 + 12, wy / 78 - 20, 4) * 2 - 1);
    cr = Math.pow(cr, 2.1);
    const massif = Math.max(0, fbm(nA, x / 150 + 60, y / 150 + 40, 2) - .42) * 2.6;   // où les montagnes ont droit de cité
    let h = base * .56 + cr * massif * .72 + fbm(nC, x / 15, y / 15, 4) * .22;   // plus de détail local
    const bord = Math.min(1, Math.min(u, v, 1 - u, 1 - v) * 4.2);
    h = h * (.18 + .82 * bord) - (1 - bord) * .20;
    tmp[y * WS + x] = h;
  }
  for (let pass = 0; pass < 1; pass++) {          // un seul lissage : deux écrasaient tout le relief de proximité
    const cp = Float32Array.from(tmp);
    for (let y = 1; y < WS - 1; y++) for (let x = 1; x < WS - 1; x++) {
      let s2 = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s2 += cp[(y + dy) * WS + x + dx];
      tmp[y * WS + x] = s2 / 9;
    }
  }
  // Étalement sur toute la plage : sinon les sommets plafonnent bien en dessous de MAXH
  // et les biomes d'altitude (falaise, pierre, neige) n'apparaissent jamais.
  let lo = 9, hi = -9;
  for (let i = 0; i < WS * WS; i++) { if (tmp[i] < lo) lo = tmp[i]; if (tmp[i] > hi) hi = tmp[i]; }
  const ech = 1 / Math.max(.001, hi - lo);
  for (let i = 0; i < WS * WS; i++) {
    const n = (tmp[i] - lo) * ech;

  }
  // ---------- l'île en terrain de plateforme ----------
  // Tout est calé sur l'enveloppe mesurée du joueur : il grimpe deux cubes et franchit cinq
  // cases de vide grâce au double saut. Le relief est donc bâti en paliers de deux cubes,
  // troué de gouffres de deux à cinq cases, et hérissé de piliers à portée de saut.
  // Un seuil pris sur la distribution plutôt qu'en dur : la proportion visée est ainsi
  // la même sur toutes les graines, quel que soit le bruit.
  const quantile = (f, garde, part) => {
    const v = [];
    for (let y = 2; y < WS - 2; y++) for (let x = 2; x < WS - 2; x++) if (garde(x, y)) v.push(f(x, y));
    if (!v.length) return Infinity;
    v.sort((a, b) => a - b); return v[Math.min(v.length - 1, (v.length * (1 - part)) | 0)];
  };
  const PAS = 2;                                   // hauteur d'un palier, en cubes
  for (let i = 0; i < WS * WS; i++) Hgt[i] = Math.round(Hgt[i] / PAS) * PAS;
  // Aucune paroi de plus de deux cubes en dessous des sommets : tout reste escaladable.
  for (let pass = 0; pass < 9; pass++) for (let y = 1; y < WS - 1; y++) for (let x = 1; x < WS - 1; x++) {
    const i = y * WS + x, h = Hgt[i];
    if (h > MAXH * .72) continue;                  // tout en haut, on garde de vraies falaises
    let mn = 99;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) mn = Math.min(mn, Hgt[(y + dy) * WS + x + dx]);
    if (h - mn > PAS) Hgt[i] = mn + PAS;
  }
  // Rampes : les bêtes ne montent que d'un cube et ne sautent pas. On coupe donc une partie
  // des parois en deux marches d'un cube, par larges bandes pour qu'elles les trouvent en
  // longeant. Sans ça l'île se découpe en enclos et l'écosystème meurt sur place.
  {
    const seuil = quantile((x, y) => fbm(nB, x / 15, y / 15, 3), (x, y) => Hgt[y * WS + x] > SEA, .45);
    const cp = Int8Array.from(Hgt, v => 0);
    for (let y = 1; y < WS - 1; y++) for (let x = 1; x < WS - 1; x++) {
      const i = y * WS + x, h = Hgt[i];

      if (fbm(nB, x / 15, y / 15, 3) < seuil) continue;
      let haut = false, bas = 99;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const v = Hgt[(y + dy) * WS + x + dx];
        if (v === h + PAS) haut = true;
        if (v > SEA) bas = Math.min(bas, v);
      }
      // on ne surélève pas une marche qui creuserait une chute de trois cubes derrière elle
      if (haut && h - bas <= 1) cp[i] = 1;
    }
    for (let i = 0; i < WS * WS; i++) if (cp[i]) Hgt[i] += 1;
  }

  // leur terrasse. Deux cubes se prennent d'un double saut, quatre demandent un relais.
  {
    const bon = (x, y) => Hgt[y * WS + x] > SEA + 2 && Hgt[y * WS + x] <= MAXH * .72;
    const seuil = quantile((x, y) => fbm(nA, x / 8 + 300, y / 8 - 120, 2), bon, .12);

// Éclairement à la Minecraft : pas de Lambert contre un soleil mobile, mais un facteur
// figé par direction de face — dessus 1, côtés 0,8 et 0,6, dessous 0,5. C'est ce qui rend
// l'image si graphique et si stable : deux faces de même orientation ont toujours
// exactement le même ton, où qu'elles soient. Pour un volume incliné (un bras, une flèche)
// on prend l'axe dominant de la normale, ce qui facette au lieu de dégrader.
function shade(n) {
  const ax = Math.abs(n[0]), ay = Math.abs(n[1]), az = Math.abs(n[2]);
  if (az >= ax && az >= ay) return n[2] > 0 ? 1 : .5;
  return ax >= ay ? .8 : .6;

function faceVisible(n) {
  // On compare la normale à la VRAIE direction de vue. L'ancienne version sommait le terme
  // horizontal et le terme vertical à poids égal, ce qui n'est juste qu'à une inclinaison
  // de 35° — l'angle où cos(elev)/√2 vaut sin(elev). Ailleurs, une face inclinée pouvait
  // être culée alors qu'elle fait face à la caméra, tandis que sa jumelle du dos était
  // conservée : on voyait l'intérieur du volume, et la plante se lisait comme un creux.
  const ca = Math.cos(ang), sa = Math.sin(ang), k = Math.cos(elev) * Math.SQRT1_2;
  return n[0] * (ca + sa) * k + n[1] * (ca - sa) * k + n[2] * Math.sin(elev) > 0.0001;
}

// La maturité se déduit de l'heure : aucun pied ne se met à jour image par image, et

// Onze silhouettes, partagées par les vingt et une espèces. C'est la forme qui porte la
// diversité : vingt variantes du même arbre se verraient tout de suite. La taille suit la
// maturité, si bien qu'on lit d'un coup d'œil ce qui est prêt et ce qui vient d'être coupé.
// Le détail se réduit avec la distance : au loin un pied ne fait que quelques pixels.
// herbes, fleurs et feuillages en plans : un éclairement uniforme, et trois fois plus de ploiement
const PLANTE_PLATE = { touffe:1, fleur:1, roseau:1, buisson:1, champi:1 };

  for (const [x, y] of cols) {
    const k = Flo[y * WS + x]; if (!k) continue;
    const sp = ESP[k - 1], i = y * WS + x, m = maturite(i, sp);
    if (m < .06) continue;
    const cx = x + .5, cy = y + .5, z = solFlore(x, y);
    const hh = sp.h * (.22 + .78 * m), w = sp.larg * (.45 + .55 * m);
    const cle = view.kEnt && view.kEnt(cx, cy), rang = rangSol(z, false);
    const dd = (cx - P.x) ** 2 + (cy - P.y) ** 2, lm = .55 + .45 * clarte();
    if (dd > sp.h * 300) continue;                 // portée de dessin proportionnée à la taille
    const det = dd < 130 ? 2 : dd < 420 ? 1 : 0;
    const A = brume(sp.bas.map(v => v * lm), Math.sqrt(dd));
    const B = brume(sp.haut.map(v => v * lm), Math.sqrt(dd));
    const uni = PLANTE_PLATE[sp.forme] ? 1 : 0;
    // Le grain aussi : sans lui une plante est un aplat au milieu d'un sol grainé, et
    // l'œil lit l'aplat comme un trou dans la surface plutôt que comme un volume posé dessus.
    const tx = view === VIEW_ISO ? (TEX_FORME[sp.forme] || TEX.touffu) : null;
    const ta = 1 - brumeF(Math.sqrt(dd));
    // Le vent couche la végétation. Plutôt que de retoucher les onze silhouettes une par une,
    // on fléchit chaque POINT selon sa hauteur : le pied ne bouge pas, le sommet prend tout,
    // et le carré de la fraction donne la courbe d'une tige. Chaque pied oscille sur sa propre
    // phase, si bien qu'un champ ondule au lieu de se coucher d'un bloc. Les herbes et les
    // fleurs ploient trois fois plus qu'un tronc.
    const pose = (a, b, lw, lh, c) => emitLimb(ploie(a), ploie(b), lw, lh, c, view, out, cle, rang, uni, tx, ta);
    const ha = hachCell(x * 3 + 5, y * 3 + 9), pen = (ha - .5) * .22;   // chacun penche un peu
    const sou = PLANTE_PLATE[sp.forme] ? 1 : .32;

    const ploie = a => { const f = Math.max(0, Math.min(1, (a[2] - z) / (hh || 1)));

// La silhouette d'un pied, commune au canvas et à WebGL : `pose` reçoit chaque volume

function formeFlore(sp, cx, cy, z, hh, w, ha, pen, det, A, B, pose) {
  switch (sp.forme) {
    case 'conifere': {                           // étages qui s'affinent vers la pointe
      const n = det > 1 ? 3 : det ? 2 : 1;
      if (det) pose([cx, cy, z], [cx, cy, z + hh * .30], w * .5, w * .5, A);
      for (let e = 0; e < n; e++) {
        const t0 = .26 + e * .62 / n, t1 = t0 + .62 / n;
        const r = w * 2.4 * (1 - e / (n + .4));
        pose([cx - r, cy, z + hh * (t0 + t1) / 2], [cx + r, cy, z + hh * (t0 + t1) / 2],
             r * .78, hh * (t1 - t0), B);
      }
      break; }
    case 'feuillu': {
      const zt = z + hh * .52, zh = z + hh, r = w * 2.2;
      if (det) pose([cx, cy, z], [cx, cy, zt], w * .55, w * .55, A);
      pose([cx - r, cy, (zt + zh) / 2], [cx + r, cy, (zt + zh) / 2], w * 1.15, zh - zt, B);
      if (det > 1) pose([cx, cy - r * .82, (zt + zh) / 2], [cx, cy + r * .82, (zt + zh) / 2],
                        w * 1, (zh - zt) * .8, B);
      break; }
    case 'palme': {                              // fût nu, palmes rayonnantes
      pose([cx, cy, z], [cx + pen * hh, cy + pen * hh, z + hh * .82], w * .5, w * .5, A);
      const sx = cx + pen * hh, sy = cy + pen * hh, zt = z + hh * .82;
      const n = det > 1 ? 4 : 2;
      for (let e = 0; e < n; e++) {
        const a = e * 6.2832 / n + ha * 3, r = w * 4.4;
        pose([sx, sy, zt], [sx + Math.cos(a) * r, sy + Math.sin(a) * r, zt - hh * .13], w * .6, w * .34, B);
      }
      break; }
    case 'buisson': {
      const r = w * 2;
      pose([cx - r, cy, z + hh * .5], [cx + r, cy, z + hh * .5], w * 1.3, hh, B);
      if (det > 1) pose([cx, cy - r * .8, z + hh * .46], [cx, cy + r * .8, z + hh * .46], w * 1.1, hh * .8, B);

    case 'touffe': {

    case 'fleur': {

      pose([cx + pen * hh - w, cy, z + hh * .88], [cx + pen * hh + w, cy, z + hh * .88], w * 1.5, w * 1.4, B);
      break; }
    case 'champi': {
      pose([cx, cy, z], [cx, cy, z + hh * .56], w * .34, w * .34, A);
      const r = w * 1.7;
      pose([cx - r, cy, z + hh * .74], [cx + r, cy, z + hh * .74], r * 1.5, hh * .3, B);
      break; }
    case 'roseau': {
      const n = det ? 3 : 1;
      for (let e = 0; e < n; e++) {
        const a = e * 2.4 + ha * 6, o = w * 1.1;
        pose([cx + Math.cos(a) * o, cy + Math.sin(a) * o, z],
             [cx + Math.cos(a) * o * 1.6 + pen * 2, cy + Math.sin(a) * o * 1.6, z + hh], w * .35, w * .35, B);

    case 'rocher': {                             // la masse prend la teinte claire : c'est elle qui prend le jour

// Le butin d'une bête abattue. Il tombe aussi quand on lui saute dessus : sans cela

function butin(b) {
  if (automate(b.sp)) {                              // son cœur d'éclat, et ce qui reste de sa carcasse
    const pi = 2 + (Math.random() * 2 | 0);
    P.sac.eclat += 1; P.sac.pierre += pi;
    say('+1 éclat · +' + pi + ' pierre', 1.8); majSac(); return;
  }
  const os = 1 + (Math.random() * 2 | 0), fi = 1 + (Math.random() * 2 | 0);
  P.sac.os += os; P.sac.fibre += fi;
  say('+' + os + ' os · +' + fi + ' fibre', 1.8); majSac();

// ============================================================
//  L'ARC
//  Une flèche est un mobile balistique : pesanteur, traînée, et une pointe qui suit
//  toujours le vecteur vitesse — c'est ce piqué du nez qui la fait lire comme une vraie
//  flèche. À 27 cases par seconde elle avance de 0,45 case par image : intégrée d'un
//  seul pas, elle traverserait un mur mince sans jamais le toucher. On découpe donc le
//  vol en sous-pas de 0,22 case au plus, et l'on teste chacun.
// ============================================================
const FLECHES = [];
const ARC_VMAX = 27, ARC_VMIN = 12, ARC_TEMPS = .85;   // vitesse à pleine bande, à peine bandé, temps de bande

// En isométrie on ne vise qu'en cap : impossible de régler la hausse. Avec un angle fixe
// la flèche passait systématiquement au-dessus des bêtes proches. On résout donc la hausse
// qui touche la cible. La formule balistique sans traînée donne l'angle de départ, puis
// trois tirs d'essai à la corde le corrigent — la traînée fait toujours tomber court.
function viser(d, dz, v) {
  const g = ARC_G, r = v ** 4 - g * (g * d * d + 2 * dz * v * v);
  if (r < 0) return null;                                // hors de portée, quoi qu'on fasse
  let a = Math.atan2(v * v - Math.sqrt(r), g * d);       // la trajectoire tendue des deux
  for (let k = 0; k < 3; k++) {
    // on simule pour de vrai, traînée comprise, et l'on redresse d'après l'erreur en hauteur
    let x = 0, z = 0, vx = Math.cos(a) * v, vz = Math.sin(a) * v, h = .02, err = null;
    for (let i = 0; i < 400 && x < d; i++) {
      vz -= g * h; const kk = 1 - ARC_TRAINEE * h; vx *= kk; vz *= kk;
      x += vx * h; z += vz * h;
      if (vx < .2) break;
    }
    err = dz - z;
    if (Math.abs(err) < .05) break;
    a += Math.max(-.25, Math.min(.25, err / Math.max(2, d)));
  }
  return (a > -1.2 && a < 1.3) ? a : null;
}

function tirerFleche(p) {
  if (!essai && P.fleches <= 0) { say('plus de flèches', 1.4); return; }
  if (!essai) P.fleches--;
  const v0 = ARC_VMIN + (ARC_VMAX - ARC_VMIN) * p;
  let dx, dy, dz;
  if (mode === 'fps') {                                 // en 1re personne on vise librement
    const cp = Math.cos(pitch); dx = Math.cos(yaw) * cp; dy = Math.sin(yaw) * cp; dz = Math.sin(pitch);
  } else {
    // on cherche une bête dans le cône de tir et l'on calcule la hausse qui l'atteint ;
    // celle de la fiche d'abord, jusqu'à soixante-dix degrés du cap : au doigt, on vise mal
    let c = null, dc = 1e9;
    const fc = cibleVue();
    if (fc && fc.sp && !fc.tame && !fc.loin) {
      const d = Math.hypot(fc.x - P.x, fc.y - P.y);
      let da = Math.atan2(fc.y - P.y, fc.x - P.x) - P.faceS;
      while (da > Math.PI) da -= 6.2832; while (da < -Math.PI) da += 6.2832;
      if (d <= 34 && Math.abs(da) < 1.22) { c = fc; dc = d; }
    }
    if (!c) for (const b of beasts) if (!b.dead && b.pv > 0 && !b.tame) {
      const ex = b.x - P.x, ey = b.y - P.y, d = Math.hypot(ex, ey);
      if (d > 34) continue;
      let da = Math.atan2(ey, ex) - P.faceS;
      while (da > Math.PI) da -= 6.2832; while (da < -Math.PI) da += 6.2832;
      if (Math.abs(da) > .45 || d > dc) continue;        // ±26° autour du cap
      dc = d; c = b;
    }
    let e = .18;                                         // à défaut, un tir tendu
    if (c) {
      const a = viser(dc, centreBete(c)[2] - (P.z + .55), v0);
      if (a !== null) { e = a; P.faceS = Math.atan2(c.y - P.y, c.x - P.x); }
    }
    const ce = Math.cos(e);
    dx = Math.cos(P.faceS) * ce; dy = Math.sin(P.faceS) * ce; dz = Math.sin(e);
  }
  const a = porte('arme');
  FLECHES.push({ x: P.x + dx * .45, y: P.y + dy * .45, z: P.z + .55 + dz * .45,
    vx: dx * v0, vy: dy * v0, vz: dz * v0, age: 0, plantee: 0, dir: [dx, dy, dz],
    deg: (a && a.deg || .8) });
  burst(P.x + dx * .4, P.y + dy * .4, P.z + .55, 4, '#dfe6f2');

}

function planter(f) {
  const v = Math.hypot(f.vx, f.vy, f.vz) || 1;
  f.dir = [f.vx / v, f.vy / v, f.vz / v];
  f.plantee = 1; f.age = 0; f.vx = f.vy = f.vz = 0;
}

// Retourne vrai si la flèche s'arrête là. Les dégâts suivent la vitesse à l'impact :
// une flèche mollement décochée pique et ne fait presque rien.
function impactFleche(f, nx, ny, nz) {
  for (const b of betesLoin) if (b.pv > 0 && toucheBete(b, nx, ny, nz)) {
    frapperLoin({ j: b.loin, b }, f.deg * Math.min(1, Math.hypot(f.vx, f.vy, f.vz) / ARC_VMAX));
    return true;
  }
  for (const j of Autres.values()) if (j.pv > 0
      && (j.x - nx) ** 2 + (j.y - ny) ** 2 < .36 && nz > j.z - .2 && nz < j.z + 1.5) {
    frapperLoin({ j, b: null }, f.deg * Math.min(1, Math.hypot(f.vx, f.vy, f.vz) / ARC_VMAX));
    return true;
  }
  for (const b of beasts) if (!b.dead && b.pv > 0 && !b.tame) {        // une flèche épargne les compagnes
    if (toucheBete(b, nx, ny, nz)) {
      const v = Math.hypot(f.vx, f.vy, f.vz), deg = f.deg * Math.min(1, v / ARC_VMAX);
      b.pv -= degJoueur(deg, b); b.hit = .25; b.alarm = 1; blesseParJoueur(b);
      lacherParoi(b);                                   // fichée dans une bête qui grimpe : elle tombe
      b.vx += f.vx * .18; b.vy += f.vy * .18;
      burst(nx, ny, nz, 10, '#ffb0a0');
      if (b.pv <= 0) { mourirBete(b, 'flèche'); butin(b); }
      else say(b.sp.n + ' · ' + Math.round(b.pv * 100) + '% · flèche ' + Math.round(deg * 100), 1.2);
      return true;                                      // la flèche est perdue dans la bête
    }
  }
  const cx = nx | 0, cy = ny | 0;
  if (nx < 1 || ny < 1 || nx >= WS - 1 || ny >= WS - 1) return false;
  if (hAt(cx, cy) > nz && nz > -5) { planter(f); return true; }
  const t = plaT(cx, cy);
  if (t && nz <= t && nz >= plaB(cx, cy)) { planter(f); return true; }
  return false;
}

function majFleches(dt) {
  for (let k = FLECHES.length - 1; k >= 0; k--) {
    const f = FLECHES[k]; f.age += dt;
    if (f.plantee) {
      if (f.age > 26) { FLECHES.splice(k, 1); continue; }
      if ((f.x - P.x) ** 2 + (f.y - P.y) ** 2 < 1 && Math.abs(f.z - P.z) < 1.6) {
        P.fleches++; FLECHES.splice(k, 1); say('+1 flèche · ' + P.fleches, 1); majSac();
      }
      continue;
    }
    if (f.age > 7) { FLECHES.splice(k, 1); continue; }
    const v = Math.hypot(f.vx, f.vy, f.vz);
    const n = Math.max(1, Math.min(24, Math.ceil(v * dt / ARC_PAS))), h = dt / n;
    let fini = false;
    for (let i = 0; i < n && !fini; i++) {
      f.vz -= ARC_G * h;
      const kk = Math.max(0, 1 - ARC_TRAINEE * h);      // la traînée fait piquer du nez
      f.vx *= kk; f.vy *= kk; f.vz *= kk;
      const nx = f.x + f.vx * h, ny = f.y + f.vy * h, nz = f.z + f.vz * h;
      if (impactFleche(f, nx, ny, nz)) { f.x = nx; f.y = ny; f.z = nz; fini = true; break; }
      f.x = nx; f.y = ny; f.z = nz;
    }
    if (fini && !f.plantee) FLECHES.splice(k, 1);       // fichée dans une bête : perdue
    else if (!f.plantee && (f.z < -6 || f.x < 1 || f.y < 1 || f.x >= WS - 1 || f.y >= WS - 1)) FLECHES.splice(k, 1);
  }
}

function emitFleches(view, out) {
  for (const f of FLECHES) {
    let u = f.dir;
    if (!f.plantee) { const v = Math.hypot(f.vx, f.vy, f.vz) || 1; u = [f.vx / v, f.vy / v, f.vz / v]; }
    const q = f.plantee ? .22 : 0;                      // fichée : seule la hampe dépasse
    const arr = [f.x - u[0] * (.52 - q), f.y - u[1] * (.52 - q), f.z - u[2] * (.52 - q)];
    const av = [f.x + u[0] * .08, f.y + u[1] * .08, f.z + u[2] * .08];
    const cle = view.kEnt && view.kEnt(f.x, f.y), rang = rangSol(f.z, false);
    emitLimb(arr, av, .055, .055, [126, 96, 66], view, out, cle, rang);
    emitLimb([f.x - u[0] * .06, f.y - u[1] * .06, f.z - u[2] * .06], av, .1, .1, [202, 210, 226], view, out, cle, rang);
  }
}

// ============================================================
//  LE CAMPEMENT
//  Un campement lie une île à un personnage. Posé sur une case plate, il s'y garde : quel que
//  soit le voyage, la pierre de foyer y ramène, et le joueur qui perd ses trois vies s'y réveille.
//  Il porte un portail : une arche de pierre qui ouvre sur une île tirée au hasard. On en revient
//  par la pierre de foyer, et l'île du campement, elle, ne change jamais.
//  Le feu remet le joueur d'aplomb et rassasie les compagnes qui l'entourent.
// ============================================================
const CARDINAUX = ['est', 'nord-est', 'nord', 'nord-ouest', 'ouest', 'sud-ouest', 'sud', 'sud-est'];
const versOu = (dx, dy) => CARDINAUX[(Math.round(Math.atan2(-dy, dx) / .7854) + 8) % 8];
// Chaque île porte un portail, posé à une place tirée de sa graine — donc la même pour tous ceux
// qui y arrivent. C'est par là qu'on s'enfonce : le campement n'est plus le seul départ.
let PortailIle = null;
const PORTAIL_R = 2.4;
function placerPortailIle() {
  PortailIle = null;
  let g = (SEED ^ 0x50a7d1) >>> 0;
  const tir = () => { g = (g * 1664525 + 1013904223) >>> 0; return g / 4294967296; };
  for (let k = 0; k < 8000; k++) {
    const q = placeCamp(6 + (tir() * (WS - 12)) | 0, 6 + (tir() * (WS - 12)) | 0);
    if (q) { PortailIle = { x: q.x, y: q.y, z: q.z }; return PortailIle; }
  }
  return null;
}
const auPortailIle = () => !!PortailIle && (P.x - PortailIle.x) ** 2 + (P.y - PortailIle.y) ** 2 < PORTAIL_R * PORTAIL_R;

// Rentré chez soi : ce que les récolteuses du campement ont amassé entre-temps entre au coffre.

function ouvrirPortail() {

// ============================================================
//  L'EXPÉDITION ET LE COFFRE
//  Franchir le portail, c'est partir en expédition. Chaque saut éloigne du campement : les bêtes

//  trouvent les espèces qu'on ne croise pas chez soi, et c'est le prix à payer pour les voir.
//  Ce qu'on rapporte n'entre au coffre qu'amputé d'un tiers par cœur perdu ; les trois perdus,
//  le sac revient vide. Et passé le cinquième saut, une mort laisse sur place les compagnes qui

const BARRIERE = 5;                                  // l'écart, depuis chez soi, d'où l'on ne ramène plus ses compagnes

// COGNE : les crocs mordent un cinquième plus fort qu'aux premiers jours — l'île n'est pas un jardin.
// La robustesse (sp.dur) de chaque espèce divise ce qu'elle encaisse : le spectre, la sentinelle
// tiennent longtemps, le moissonneur plie vite.
const COGNE = 1.2;

  const p = Math.min(profondeur(), NIV_MAX);

  const cap = sp.diet === 'c' ? sp.cap : sp.cap * facteurHerbe;

// Le sac et le coffre parlent des mêmes matières — mais les baies vivent à part dans le sac.
const auSac = r => r === 'baies' ? P.baies : (P.sac[r] || 0);
const metSac = (r, v) => { const n = Math.max(0, v | 0); if (r === 'baies') P.baies = n; else P.sac[r] = n; };

// ============================================================
//  LE MONDE PARTAGÉ
//  Deux joueurs sur la même graine voient le même relief : le terrain n'a rien à échanger.

// Cinq positions par seconde. Realtime compte un message à l'envoi PLUS un par destinataire :

  const a = ((h >>> 0) % 360) * Math.PI / 180;

}

function reseauUrl() {

// ============================================================
//  LE JOURNAL DES GRAINES
//  Le campement tient un journal : chaque île visitée y laisse sa fiche — sa graine, ce qu'on y
//  trouve (biomes, bestiaire), et à qui elle est. Les expéditions s'y inscrivent seules ; garder
//  une graine, c'est pouvoir y retourner, et la mémoire du journal est celle du campement.
//  Un campement neuf ne retient qu'une graine ; amélioré à l'éclat, il en retient trois, puis six,
//  et son portail sait viser au lieu de tirer au hasard.

const CAMP_NIV = [
  { niv: 1, n: 'Campement', memoire: 1, cout: null, d: 'une graine en mémoire · portail au hasard' },
  { niv: 2, n: 'Campement gravé', memoire: 3, cout: { eclat: 24, pierre: 30 },
    d: 'trois graines en mémoire · le portail vise une île gardée' },
  { niv: 3, n: 'Campement d\'éclat', memoire: 6, cout: { eclat: 60, pierre: 40, os: 24 },

const nivCamp = () => (P.camp && P.camp.niv) || 1;
const paletteCamp = () => CAMP_NIV[Math.min(CAMP_NIV.length, nivCamp()) - 1];
const memoireJournal = () => paletteCamp().memoire;

  const morceaux = (dedans) => {

          const k = v * WS + u;

// ---------- les sorts ----------
const dalles = [];                                // dalles conjurées, avec leur sursis
function lancerSort() {
  const gr = porte('grimoire');
  if (!gr) { say('aucun grimoire équipé', 1.4); return; }
  if (!essai && P.mana < gr.mana) { say('mana insuffisant', 1.4); return; }
  let ok = true;
  if (gr.id === 'souffle') {
    let n = 0;
    for (const b of beasts) if (!b.dead && b.pv > 0 && !b.tame) {
      const dx = b.x - P.x, dy = b.y - P.y, d = Math.hypot(dx, dy);
      if (d < 7) { lacherParoi(b); b.vx += dx / (d || 1) * 9; b.vy += dy / (d || 1) * 9; b.alarm = 1; n++; }

    const zt = Math.max(1, Math.floor(P.z)); let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = (P.x | 0) + dx, y = (P.y | 0) + dy;
      if (x < 1 || y < 1 || x >= WS - 1 || y >= WS - 1) continue;
      const i = y * WS + x;
      if (PlT[i] || Hgt[i] + 1 >= zt) continue;   // ni sur une dalle, ni dans le relief
      PlT[i] = zt; PlB[i] = zt - 1; dalles.push({ i, zt, t: 12 }); n++;
      signalDecor('dalle', i);
    }
    if (!n) { ok = false; say('pas de place pour la dalle', 1.6); }
    else { burst(P.x, P.y, zt, 18, '#cfd6e4'); say('dalle conjurée · 12 s', 2); }
  } else if (gr.id === 'appel') {
    // L'Appel ne fait plus qu'offrir un lien : il en faut un de libre, et la bête peut refuser.

    let pr = null, dp = 144;

      }

function majDalles(dt) {
  for (let k = dalles.length - 1; k >= 0; k--) {

function dessinIcone(trace) {
  const W = 16, g = new Array(W * W).fill(null);
  const px = (x, y, c) => { x = Math.round(x); y = Math.round(y);
    if (x >= 0 && y >= 0 && x < W && y < W) g[y * W + x] = c; };
  const rect = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) px(x, y, c); };
  const ligne = (x0, y0, x1, y1, c, ep = 1) => {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2 || 1;
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
      px(x, y, c);
      if (ep > 1) { px(x + 1, y, c); if (ep > 2) px(x, y - 1, c); }
    }
  };
  const disque = (cx, cy, r, c) => {
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
        if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r + .25) px(x, y, c);
  };
  const arc = (cx, cy, r, a0, a1, c, ep = 1) => {
    const n = Math.ceil(Math.abs(a1 - a0) * r * 2);
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1 - a0) * i / n;
      for (let e = 0; e < ep; e++) px(cx + Math.cos(a) * (r - e), cy + Math.sin(a) * (r - e), c);
    }
  };
  const brut = new Set();                               // pixels posés tels quels, sans modelé
  const net = (x, y, c) => { px(x, y, c); brut.add(y * W + x); };
  trace({ px, rect, ligne, disque, arc, net });

  const plein = (x, y) => x >= 0 && y >= 0 && x < W && y < W && g[y * W + x];
  const out = new Array(W * W).fill(null);
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const c = g[y * W + x]; if (!c) continue;
    if (brut.has(y * W + x)) { out[y * W + x] = c; continue; }
    const hautG = !plein(x - 1, y) || !plein(x, y - 1), basD = !plein(x + 1, y) || !plein(x, y + 1);
    const k = hautG && !basD ? 1.22 : basD && !hautG ? .74 : 1;
    out[y * W + x] = c.map(v => Math.max(0, Math.min(255, v * k + (k > 1 ? 12 : 0))));
  }

  const bord = [22, 18, 16];
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    if (g[y * W + x]) continue;
    if (plein(x - 1, y) || plein(x + 1, y) || plein(x, y - 1) || plein(x, y + 1)) out[y * W + x] = bord;
  }
  return out;
}

const compagneDe = id => P.compagnes.find(c => String(c.id) === String(id));

// Rejoindre quelqu'un : son île n'est qu'une graine de plus, et le portail sait y aller.
function rejoindreJoueur(u) {

      : `<button class="btn principal" data-sortir="${id}"${c.ko || enJeu() >= EN_JEU_MAX ? ' disabled' : ''}>Sortir</button>`)
    + (automate(sp) ? '' : `<button class="btn" data-nourrirc="${id}"${P.baies > 0 && faim >= .05 ? '' : ' disabled'}>Nourrir · 1 baie</button>`)
    + `<button class="btn ${confirme ? 'alerte' : 'discret'}" data-liberer="${id}">${confirme ? 'Confirmer' : 'Libérer'}</button>`;
  return `<div class="fiche haute" id="sac-fiche">`
    + caseObjet('bete_' + c.esp, { taille: 'grande', inerte: true, lie: c.dehors && !c.ko, ko: c.ko })
    + `<div class="fiche-texte"><h4>${ESC(c.nom)}</h4><p>${ESC(sp.n)} · ${ESC(sp.metier)}</p>`
    + `<span class="genre" data-val="${id}:ou">${ESC(ouEstCompagne(c))}</span></div></div>`
    + `<div class="besoins">${jauge('pv', 'Santé', 'vie')}${automate(sp) ? jauge('nrj', 'Charge', 'nrj')
        : jauge('faim', 'Faim', 'faim') + jauge('soif', 'Soif', 'soif') + jauge('nrj', 'Énergie', 'nrj')}</div>`
    + `<h3>Ordres</h3>${ordres}`
    + `<p class="note" style="margin:6px 0 0">${ESC(c.nom)} ${ESC(ORDRES_DIT[c.role + ':' + (c.mode || 'joueur')] || '')}`
    + `${c.role === 'recolte' && Object.keys(sp.travail || {}).length ? ' — elle ' + ESC(sp.metier) : ''}.</p>`
    + (P.camp ? '' : `<p class="note" style="margin:4px 0 0">« Au campement » se choisit une fois le campement posé.</p>`)
    + (!c.dehors && !c.aucamp && !c.ko && enJeu() >= EN_JEU_MAX
      ? `<p class="note manque">Six compagnes sont déjà en jeu : rentrez-en une dans le sac pour sortir ${ESC(c.nom)}.</p>` : '')
    + `<div class="gestes">${gestes}</div>`
    + (confirme ? `<p class="note manque">Encore un clic : ${ESC(c.nom)} retourne à l'île, et le lien redevient libre.</p>` : '')
    + (c.ko ? `<p class="note">À bout de forces, elle ne ressortira qu'à la moitié de sa santé.</p>` : '');
}
// Les jauges bougent sans cesse : on ne touche qu'à leur largeur et à leur texte.
let jaugesT = 0;
function majJaugesCompagnes() {
  const s = maintenantSac();
  if (s - jaugesT < .25 || !document.querySelectorAll) return;
  jaugesT = s;
  const el = document.getElementById('sac');
  for (const c of P.compagnes) for (const k of ['pv', 'faim', 'soif', 'nrj']) {
    const v = Math.round(Math.min(1, Math.max(0, valeurComp(c, k))) * 100);
    el.querySelectorAll(`[data-jauge="${c.id}:${k}"]`).forEach(n => { n.style.width = v + '%'; });
    const b = el.querySelector(`[data-val="${c.id}:${k}"]`); if (b) b.textContent = v + '\u202f%';
  }
  const c = compagneDe(choixComp);
  if (c) { const o = el.querySelector(`[data-val="${c.id}:ou"]`); if (o) o.textContent = ouEstCompagne(c); }
}

// ---------- le cadre ----------
function majSac() {
  if (!sacOuvert) return;
  const el = document.getElementById('sac');
  const actif = document.activeElement;
  if (actif && actif.tagName === 'SELECT' && el.contains(actif)) { sacEnAttente = true; return; }
  // Le panneau est réécrit en entier : on garde la saisie d'un code et la position des listes.
  const champ = document.getElementById('svcode');
  const saisie = champ ? champ.value : '', enSaisie = !!champ && document.activeElement === champ;
  const defil = {};
  if (el.querySelectorAll) el.querySelectorAll('[data-defil]').forEach(n => { defil[n.dataset.defil] = n.scrollTop; });
  const focus = document.activeElement && document.activeElement.closest && document.activeElement.closest('#sac [data-onglet], #sac [data-recette], #sac [data-choix], #sac [data-filtre], #sac [data-comp], #sac [data-role]');
  const focusCle = focus ? ['onglet', 'recette', 'choix', 'filtre', 'comp', 'role'].map(k => focus.dataset[k] !== undefined ? `[data-${k}="${focus.dataset[k]}"]` : '').join('') : '';
  feuilleIcones();
  const page = { sac: pageSac, etabli: pageEtabli, compagnes: pageCompagnes, camp: pageCampement,
    journal: pageJournal, sauve: pageSauve, reglages: pageReglages }[ongletSac]();
  let nDefil = 0;
  const titre = ONGLETS.find(o => o.id === ongletSac).n;
  const rail = ONGLETS.map((o, i) =>
    `<button role="tab" id="onglet-${o.id}" aria-controls="sac-page" aria-selected="${o.id === ongletSac}" tabindex="${o.id === ongletSac ? 0 : -1}"`
    + ` class="${o.id === ongletSac ? 'on' : ''}" data-onglet="${o.id}" title="${o.n} (${i + 1})">${img(o.ic)}<span>${o.n}</span></button>`).join('');
  const vies = [0, 1, 2].map(i => img('vie', i < lives ? '' : 'eteint')).join('');
  const jauges = `<div class="jauges" aria-label="Vie ${Math.round(P.pv * 100)} %, mana ${Math.round(P.mana)}">`
    + `<span class="vies" title="${lives} vie${lives > 1 ? 's' : ''}">${vies}</span>`
    + `<span class="jauge" title="Santé">${img('vie')}<span class="barre vie"><i style="width:${Math.round(P.pv * 100)}%"></i></span></span>`
    + `<span class="jauge" title="Mana">${img('mana')}<span class="barre mana"><i style="width:${Math.round(P.mana)}%"></i></span></span></div>`;
  el.innerHTML = `<div class="sac-cadre">`
    + `<nav class="sac-rail" role="tablist" aria-label="Sections du sac">${rail}`
    + `<button class="fermer" data-fin="1" aria-label="Fermer le sac" title="Fermer (Échap)">✕</button></nav>`
    + `<section class="sac-page" id="sac-page" role="tabpanel" aria-labelledby="onglet-${ongletSac}">`
    + `<header class="sac-tete"><h2>${titre}</h2>${essai ? '<span class="badge">Essai</span>' : ''}${jauges}</header>`
    + page.replace(/<div class="(col|sac-corps[^"]*)"/g, (m, c) => `<div class="${c}" data-defil="${ongletSac}-${nDefil++}"`)
    + `</section></div>`;
  if (el.querySelectorAll) el.querySelectorAll('[data-defil]').forEach(n => { if (defil[n.dataset.defil]) n.scrollTop = defil[n.dataset.defil]; });
  const nouveau = document.getElementById('svcode');
  if (nouveau) { nouveau.value = saisie; if (enSaisie) nouveau.focus(); }
  if (focusCle && el.querySelector) { const f = el.querySelector(focusCle); if (f) f.focus(); }
}
function choisirOnglet(id) {
  if (!ONGLETS.some(o => o.id === id)) return;
  ongletSac = id;
  majSac();
  const b = document.getElementById('onglet-' + id);
  if (b && b.focus && sacOuvert) b.focus();
}
function ouvrirSac(v, onglet) {
  sacOuvert = v === undefined ? !sacOuvert : v;
  if (onglet) ongletSac = onglet;
  if (sacOuvert) {
    for (const k in K) K[k] = false; P.arc = null;   // on lâche tout en ouvrant
    if (camPrise()) document.exitPointerLock();      // sinon les clics n'atteignent pas le panneau
  }
  document.getElementById('sac').classList.toggle('on', sacOuvert);
  majSac();
  const actif = document.activeElement;
  if (sacOuvert) { const b = document.getElementById('onglet-' + ongletSac); if (b && b.focus) b.focus(); }
  else if (actif && actif.closest && actif.closest('#sac') && actif.blur) actif.blur();
}
// Un seul écouteur pour tout le panneau : son contenu est réécrit à chaque changement.
function clicSac(b) {
  const d = b.dataset;
  if (d.onglet) choisirOnglet(d.onglet);
  else if (d.choix !== undefined) { choixSac = choixSac === d.choix ? null : d.choix; majSac(); montrerFiche(); }
  else if (d.recette) { choixEtabli = d.recette; majSac(); montrerFiche(); }
  else if (d.filtre) { filtreEtabli = d.filtre; majSac(); }
  else if (d.voir) { filtreEtabli = d.voir; choixEtabli = null; choisirOnglet('etabli'); }
  else if (d.voirsac) { choixSac = d.voirsac; choisirOnglet('sac'); }
  else if (d.rac !== undefined && choixSac && P.objets[choixSac]) { assignerRaccourci(choixSac, +d.rac); casesSig = ''; majSac(); }
  else if (d.fa) {
    const avant = P.objets[d.fa], fl = P.fleches, li = P.liens;
    fabriquer(d.fa);
    if ((P.objets[d.fa] && !avant) || P.fleches > fl || P.liens > li) { dernierFait = { id: d.fa, quand: maintenantSac() }; choixSac = P.objets[d.fa] ? d.fa : choixSac; majSac(); }
  }
  else if (d.camp) {
    if (d.camp === 'poser') poserCampement();
    else if (d.camp === 'portail') ouvrirPortail();
    else if (d.camp === 'rentrer') rentrerAuCampement();
    else if (d.camp === 'repos') seReposer();
    else if (d.camp === 'reprendre') {
      if (maintenantSac() < confirmeCamp) { confirmeCamp = 0; reprendreCampement(); }
      else { confirmeCamp = maintenantSac() + 5; setTimeout(() => { if (sacOuvert && ongletSac === 'camp') majSac(); }, 5100); }
    }
    else if (d.camp === 'ameliorer') ameliorerCamp();
    else if (d.camp === 'ouvrir') choisirOnglet('camp');
    majSac();
  }
  else if (d.rejoindre) { rejoindreJoueur(d.rejoindre); majSac(); }
  else if (d.coffre) {
    if (d.coffre === 'deposer') deposerCoffre();
    else if (d.coffre === 'reprendre') reprendreCoffre();
    majSac();
  }
  else if (d.jr) {
    const g = +d.g;
    if (d.jr === 'garder') garderGraine(g);
    else if (d.jr === 'oublier') oublierGraine(g);
    else if (d.jr === 'aller') partirVers(g);
    majSac();
  }
  else if (d.comp) { choixComp = d.comp === 'libre' ? 'libre' : +d.comp; confirmeLibere.id = null; majSac(); montrerFiche(); }
  else if (d.role) { const c = compagneDe(d.cid); if (c) changerRole(c, d.role); }
  else if (d.sortir) { const c = compagneDe(d.sortir); if (c) sortirCompagne(c); majSac(); }
  else if (d.rentrer) { const c = compagneDe(d.rentrer); if (c) rentrerCompagne(c); majSac(); }
  else if (d.nourrirc) { const c = compagneDe(d.nourrirc); if (c) nourrirCompagne(c); }
  else if (d.liberer) {
    const c = compagneDe(d.liberer);
    if (!c) return;
    if (confirmeLibere.id === c.id && maintenantSac() < confirmeLibere.jusqua) { confirmeLibere.id = null; libererCompagne(c); }
    else {
      confirmeLibere = { id: c.id, jusqua: maintenantSac() + 4 };
      setTimeout(() => { if (sacOuvert && ongletSac === 'compagnes') majSac(); }, 4100);
      majSac();
    }
  }
  else if (d.eq) equiper(d.eq);
  else if (d.essai) { if (essai) sortirEssai(); else entrerEssai(); majSac(); }
  else if (d.tout) { entrerEssai(); toutFabriquer(); }
  else if (d.tex) { textures = !textures; majSac(); }
  else if (d.isogl) { isoGL = !isoGL; majSac(); }
  else if (d.mesures) { mesures = !mesures; majSac(); }
  else if (d.dens) { DENS_GLOB = DENS_GLOB < .6 ? .7 : DENS_GLOB > 1 ? .45 : 1.15; calcFlore(); majSac(); }
  else if (d.fin) ouvrirSac(false);
  else if (d.sv) actionSauvegarde(d.sv);
}
// Sur écran étroit, les colonnes s'empilent : le détail est sous la liste, on l'amène à l'écran.
function montrerFiche() {
  if (typeof matchMedia !== 'function' || !matchMedia('(max-width:640px)').matches) return;
  const f = document.getElementById('sac-fiche');
  if (!f || !f.scrollIntoView) return;
  const doux = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  f.scrollIntoView({ block: 'start', behavior: doux ? 'smooth' : 'auto' });
}
// Au clavier, dans le rail : les flèches passent d'un onglet à l'autre.
function clavierSac(e) {
  const b = e.target && e.target.closest && e.target.closest('#sac [role="tab"]');
  if (!b || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return false;
  const i = ONGLETS.findIndex(o => o.id === b.dataset.onglet), n = ONGLETS.length;
  const j = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1
    : (i + (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 1) + n) % n;
  choisirOnglet(ONGLETS[j].id);
  return true;
}

const MOUV = { KeyW:1, KeyA:1, KeyS:1, KeyD:1, ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1 };
const TOUCHES = {

// ---------- mise à jour ----------
function update(dt) {
  t += dt;
  ang += (angT - ang) * Math.min(1, dt * 9);
  elev += (elevT - elev) * Math.min(1, dt * 7);
  setProjection();
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) document.getElementById('msg').style.opacity = 0; }
  // Le retour se constate sur place : arrivé près de son feu, l'expédition se ferme et le
  // butin passe au coffre. Peu importe par où l'on est rentré — portail, pierre, ou à pied.
  if (P.camp && campIci() && auCamp()
      && (P.exp.sortie || P.exp.coeurs || P.exp.niveau !== nivCampement())) clotureExpedition();
  majReseau(dt);                                     // les autres joueurs, s'il y en a

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 9 * dt;
    if (p.age > p.life) parts.splice(i, 1);
  }
  for (const c of crates) if (c.slide > 0) {
    c.slide -= dt * 4.5;
    if (c.slide <= 0) { c.slide = 0; c.dx = c.dy = 0; }
  }
  if (won) { P.bob += dt * 6; return; }
  // la monture : perdue, morte, rentrée au sac ou déliée, on en descend
  if (P.monture && (P.monture.dead || P.monture.pv <= 0 || !beasts.includes(P.monture) || (!P.rodeo && (!P.monture.tame || !P.monture.comp || !P.monture.comp.dehors)))) descendre(false);
  const Mt = monture() && !P.rodeo ? P.monture : null, M = Mt && Mt.sp.monture;
  P.selle = P.monture ? P.monture.sp.sz * .9 : 0;
  if (P.rodeo) majRodeo(dt); else {
  // --- direction voulue, exprimée dans le repère de l'écran puis ramenée au monde ---
  let ix = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
  let iy = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
  ix += stick.x; iy += stick.y;
  const im = Math.hypot(ix, iy); if (im > 1) { ix /= im; iy /= im; }
  let wx, wy;

    // avant = direction du regard, côté = perpendiculaire à gauche
    const fwd = -iy, str = ix, cy = Math.cos(yaw), sy = Math.sin(yaw);
    wx = fwd * cy - str * sy; wy = fwd * sy + str * cy;
  } else {
    const S = Math.SQRT1_2, rdx = (ix + iy) * S, rdy = (iy - ix) * S;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    wx = rdx * ca + rdy * sa; wy = -rdx * sa + rdy * ca;
  }

  // L'endurance. On marche sans compter ; on court (Maj, ou le manche poussé à fond) à l'ancienne
  // vitesse tant qu'il en reste — huit secondes. À sec, on se traîne, plus lent que tout
  // prédateur, jusqu'à en avoir retrouvé un bon tiers. Le double saut, lui, reste gratuit.
  const veutCourir = K.ShiftLeft || K.ShiftRight || Math.hypot(stick.x, stick.y) > .9;
  let SPD;
  if (M) {                                            // en selle : l'allure et le souffle de la monture
    if (Mt.endu === undefined) Mt.endu = 1;
    const court = im > .06 && veutCourir && !Mt.essouffle && !(P.recul > 0);
    if (court) { Mt.endu = Math.max(0, Mt.endu - dt / M.endu); if (Mt.endu <= 0) { Mt.essouffle = true; say(nomBete(Mt) + ' est essoufflé', 1.5); } }
    else Mt.endu = Math.min(1, Mt.endu + dt * .1);
    if (Mt.essouffle && Mt.endu >= .3) Mt.essouffle = false;
    P.endu = Math.min(1, P.endu + dt * ENDU_REPOS * .5);   // le cavalier, lui, souffle
    if (P.epuise && P.endu >= ENDU_SEUIL) P.epuise = false;
    SPD = Mt.essouffle ? M.marche * .8 : court ? M.course : M.marche;
  } else {
  const court = im > .06 && veutCourir && !P.epuise && !(P.recul > 0);
  if (court) { P.endu = Math.max(0, P.endu - dt / ENDU_COURSE); P.courseT = t; if (P.endu <= 0) { P.epuise = true; say('à bout de souffle', 1.6); } }
  else if (t - P.courseT > .5) P.endu = Math.min(1, P.endu + dt * (im > .06 ? ENDU_REPRISE : ENDU_REPOS));
  if (P.epuise && P.endu >= ENDU_SEUIL) P.epuise = false;
  SPD = P.epuise ? VIT_EPUISE : court ? VIT_COURSE : VIT_MARCHE;
  }
  const ACC = 26, FRIC = 20;
  // Projeté par un coup, on ne tient plus ses appuis : ni frottement ni commande pendant 0,3 s.
  // Le frottement (20 par seconde, en l'air aussi) mangeait le recul en six images : on reculait
  // de 0,35 case, et le chasseur, encore lancé par son bond, glissait dessous.
  if (P.recul > 0) P.recul -= dt;
  else if (im > 0.06) { P.vx += (wx * SPD - P.vx) * Math.min(1, dt * ACC / 3); P.vy += (wy * SPD - P.vy) * Math.min(1, dt * ACC / 3); P.face = Math.atan2(wy, wx); }
  else { const k = Math.max(0, 1 - FRIC * dt); P.vx *= k; P.vy *= k; }
  { let d = P.face - P.faceS;                       // on prend toujours le plus court chemin angulaire
    while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    P.faceS += d * Math.min(1, dt * 13); }

  // --- déplacement axe par axe, en poussant les caisses ---
  const tryAxis = (axis) => {
    const step = (axis === 'x' ? P.vx : P.vy) * dt;
    if (!step) return;
    const nx = P.x + (axis === 'x' ? step : 0), ny = P.y + (axis === 'y' ? step : 0);
    if (!blockedAt(nx, ny, P.z)) { P.x = nx; P.y = ny; return; }
    // obstacle : si c'est une caisse posée à notre niveau, on tente de la pousser
    const cx = Math.floor(nx + (axis === 'x' ? Math.sign(step) * R : 0));
    const cy = Math.floor(ny + (axis === 'y' ? Math.sign(step) * R : 0));
    const cr = crateAt(cx, cy);
    if (cr && cr.slide <= 0 && P.ground && Math.abs(P.z - cr.z) < 0.4) {
      const dx = axis === 'x' ? Math.sign(step) : 0, dy = axis === 'y' ? Math.sign(step) : 0;
      const tx = cr.x + dx, ty = cr.y + dy;
      if (hAt(tx, ty) === cr.z && !crateAt(tx, ty)) {
        cr.x = tx; cr.y = ty; cr.dx = -dx; cr.dy = -dy; cr.slide = 1;
        burst(tx + .5, ty + .5, cr.z, 5, '#d9b283');
      } else if (hAt(tx, ty) === 0 && !crateAt(tx, ty)) {         // on comble un trou
        cr.x = tx; cr.y = ty; cr.z = 0; cr.dx = -dx; cr.dy = -dy; cr.slide = 1;
        burst(tx + .5, ty + .5, 0, 8, '#d9b283'); say('LE VIDE EST COMBLÉ', 1.6);
      }
    }
    if (axis === 'x') P.vx = 0; else P.vy = 0;
  };
  tryAxis('x'); tryAxis('y');

  // --- vertical ---
  if (jumpQ) { P.buf = .14; jumpQ = false; }
  P.buf -= dt; P.coyote = P.ground ? .12 : P.coyote - dt;
  if (P.buf > 0 && P.coyote > 0) { P.vz = M ? M.saut : 6.6; P.buf = 0; P.coyote = 0; P.ground = false; P.saut2 = !M; burst(P.x, P.y, P.z, M ? 8 : 4, M ? '#d9b283' : '#cfd6e4'); }
  // Second souffle en l'air : c'est lui qui ouvre le relief vertical. Un peu plus court que
  // le premier, et il repart de la vitesse courante — sauter au sommet de l'arc monte le plus
  // haut, sauter tard porte le plus loin.
  else if (P.buf > 0 && P.saut2) { P.vz = 6.0; P.buf = 0; P.saut2 = false; burst(P.x, P.y, P.z, 7, '#a8e0d8'); }
  const z0 = P.z;                                       // d'où l'on part : le pas entier compte
  P.vz -= (P.vz > 0 ? 17 : 26) * dt;                    // chute plus rapide que la montée
  if (M && M.plane && P.vz < -1.7 && im > .06) { P.vz = -1.7; if ((t * 10 | 0) % 3 === 0) burst(P.x, P.y, P.z + .8, 1, '#ffd0e8'); }   // l'aurore plane
  P.z += P.vz * dt;
  if (P.vz > 0) {                                       // on se cogne sous une île volante
    const pl = ceilOver(P.x, P.y, P.z);
    if (P.z + PH > pl) { P.z = pl - PH; P.vz = 0; burst(P.x, P.y, P.z + PH, 4, '#b9c2d6'); }
  }
  // On cherche le sol depuis le point HAUT du pas, pas depuis le point d'arrivée. En tombant
  // d'une île volante on descend de plus d'un cube par image — bien au-delà de la tolérance
  // de 0,35 — si bien que le sol passait sous le radar et qu'on le traversait. Même défaut

  const fl = floorUnder(P.x, P.y, Math.max(z0, P.z));
  const wasAir = !P.ground;
  P.ground = false;
  if (P.vz <= 0 && P.z <= fl && fl > -50) {
    if (wasAir && P.vz < -3) { P.land = 0.20; burst(P.x, P.y, P.z, 5, '#b9c2d6'); }
    P.z = fl; P.vz = 0; P.ground = true; P.saut2 = true;
    if (fl > SEA) P.sol = [P.x, P.y, fl];            // dernier sol sûr : on y revient après une chute
  }
  if (P.land > 0) P.land = Math.max(0, P.land - dt * 4.5);
  if (P.z < -6) { respawn(); }
  P.bob += dt * (P.ground ? Math.hypot(P.vx, P.vy) * 1.6 : 0);
  if (P.hurt > 0) P.hurt -= dt;
  }                                                     // fin du pas à pied ou en selle

  // --- baies : on les ramasse en passant dessus ---
  for (const br of berries) if (br.pris <= t && (br.x - P.x) ** 2 + (br.y - P.y) ** 2 < .9 && Math.abs(br.z - P.z) < 2) {
    cueillirBaie(br); P.baies++;                     // elles repoussent, comme le reste
    burst(br.x, br.y, br.z + .4, 8, '#e07898'); say('+1 baie · ' + P.baies, 1);
  }
  // --- sac, sorts et récolte ---
  if (P.recolte > 0) P.recolte -= dt;
  if (P.frappe > 0) P.frappe -= dt;
  P.mana = Math.min(100, P.mana + dt * 4 * (1 + ((porte('armure') || {}).mana || 0)));
  majDalles(dt);
  if (agirQ) { agirQ = false; attaquerDown(); }
  if (lacheQ) { lacheQ = false; attaquerUp(); }
  if (actQ) { actQ = false; faireAction(); }
  if (P.arc !== null) P.arc += dt;
  majFleches(dt); majTirs(dt);
  if (sortQ) { sortQ = false; lancerSort(); }

  // --- l'écosystème vit sa vie, les compagnes avec lui ---

  // --- nourrir : la confiance vient en mangeant, et au bout on est suivi ---
  if (nourrir) {

    // à la bête sauvage qu'on essaie d'apprivoiser juste à côté.

      if (b.tame && b.faim < .15) { if (!repue) repue = b; continue; }
      if (d < dc) { dc = d; c = b; }
    }
    if (!c) say(repue && repue.comp ? repue.comp.nom + ' n\'a pas faim' : 'aucune bête à portée', 1.4);
    else if (automate(c.sp)) rallumer(c);
    else if (coursier(c.sp) && !c.tame) say('un coursier ne se lie pas aux baies : sautez sur son dos', 2);
    else if (P.baies <= 0) say('plus de baies', 1.4);
    else if (!c.tame && c.sp.diet === 'c' && c.faim < .35) say(c.sp.n + " n'a pas faim", 1.6);
    else {
      P.baies--; c.faim = Math.max(0, c.faim - .5); c.alarm = 0;
      burst(c.x, c.y, c.z + .5, 10, '#ffd68a');
      if (c.tame) say((c.comp ? c.comp.nom : c.sp.n) + ' mange · faim ' + Math.round(c.faim * 100) + ' %', 1.5);
      else {
        // La confiance vient en mangeant, plus lentement chez les espèces rares, plus vite chez
        // une bête blessée. Au bout, il faut un lien libre pour qu'elle s'y attache.
        c.conf = Math.min(1, c.conf + .34 * c.sp.lien * (1 + .8 * (1 - Math.max(0, c.pv))));
        if (c.conf >= 1) { if (!lier(c, 'baies')) say('confiance totale · il faut un lien d\'éclat libre', 2.6); }
        else say('confiance ' + Math.round(c.conf * 100) + ' %', 1.5);
      }
    }
  }
  // --- les chasseurs s'en prennent au joueur ; on peut leur retomber dessus ---

// ---------- monter, tenir, descendre ----------

// Le rodéo : c'est la bête qui mène. Elle file, vire, se cabre ; le cavalier tient tant qu'il

  const M = b.sp.monture, tient = !!(K.KeyC || actTenu);

  // suit ce qu'elle fait — marcher dans vos pas la repose un peu (à −0,004 par seconde, une bête
  // en défense tombait à zéro en deux minutes et demie et traînait ensuite pour de bon ; à zéro,
  // un chasseur épuisé par une course ratée ne rattrapait plus jamais rien), travailler l'use en
  // quatre minutes, se battre, chasser ou accourir bien plus vite, et le repos refait.

  // lâche le travail pour manger et ne guérit plus ; mais un joueur qui traverse un plateau pelé

  emitFleches(VIEW_FPS, items); emitTirs(VIEW_FPS, items);
  items.sort((a, b) => (b.d - a.d) || ((b.d2 || 0) - (a.d2 || 0)) || ((b.d3 || 0) - (a.d3 || 0)));

// pointeur est libre et que rien ne se vise. La forme doit suffire à savoir où l'on est.
function viseur() {
  const x = Wd / 2, y = Hd / 2;

    const e = 2 + (P.arc !== null ? Math.min(1, P.arc / ARC_TEMPS) * 9 : 0);
    g.strokeStyle = 'rgba(230,238,255,.62)'; g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(x - 7 - e, y); g.lineTo(x - 2 - e, y);
    g.moveTo(x + 2 + e, y); g.lineTo(x + 7 + e, y);
    g.moveTo(x, y - 7 - e); g.lineTo(x, y - 2 - e);
    g.moveTo(x, y + 2 + e); g.lineTo(x, y + 7 + e);
    g.stroke();
    g.fillStyle = 'rgba(230,238,255,.62)'; g.fillRect(x - .75, y - .75, 1.5, 1.5);
  } else {
    g.strokeStyle = 'rgba(190,205,230,.40)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(x, y, 8, 0, 6.2832); g.stroke();
    g.fillStyle = 'rgba(190,205,230,.28)';
    g.beginPath(); g.arc(x, y, 2, 0, 6.2832); g.fill();
    g.fillStyle = 'rgba(150,163,185,.78)';
    g.font = '500 11px ui-monospace,Menlo,Consolas,monospace'; g.textAlign = 'center';
    g.fillText('CLIC DROIT : PRENDRE LA CAMÉRA', x, y + 30);
    g.textAlign = 'left';
  }
}

// ---------- le rythme ----------

function majSauvegarde() {

  if (sig !== Sauve.signature) { Sauve.signature = sig; Sauve.sale = true; Sauve.tChange = s; }

  const mur = s - Sauve.tChange >= 4 || s - Sauve.tPremier >= 20;

// ---------- le mode essai est un bac à sable ----------
// Ce qu'on y fabrique ne doit pas rester : sans cela, un « Tout fabriquer » partirait en ligne

// ---------- changer d'île ----------
// La graine est gardée : recharger la page rend la même île. Pour en voir une autre, on tire
// une nouvelle graine, on l'écrit dans la copie locale et on recharge. Le personnage garde

// revient pas.

function actionSauvegarde(quoi) {

// ---------- la porte ----------
// Quatre états : se connecter, créer un compte, demander un nouveau mot de passe, et — quand on

const $p = id => document.getElementById(id);

  [/invalid login credentials/i, 'adresse ou mot de passe incorrect'],
  [/email not confirmed/i, 'adresse pas encore confirmée : ouvrez le courriel reçu'],
  [/user already registered|already been registered/i, 'cette adresse a déjà un compte'],
  [/password should be at least (\d+)/i, 'mot de passe trop court : 8 caractères au moins'],
  [/unable to validate email|invalid format/i, 'adresse e-mail invalide'],
  [/for security purposes|rate limit|too many/i, 'trop d\'essais : patientez une minute'],

}
function porteMsg(txt, bien) {
  const el = $p('pmsg'); el.textContent = txt || ''; el.className = 'msg' + (bien ? ' bien' : '');
}
function porteMode(m) {
  Porte.mode = m;

    oubli: 'un lien de réinitialisation vous sera envoyé', nouveau: 'choisissez un nouveau mot de passe' }[m];
  $p('psous').textContent = sous;
  $p('pok').textContent = { connexion: 'Se connecter', inscription: 'Créer le compte',
    oubli: 'Envoyer le lien', nouveau: 'Enregistrer' }[m];
  $p('pbasc').textContent = m === 'connexion' ? 'Créer un compte' : 'J\'ai déjà un compte';
  $p('pmdpl').style.display = m === 'oubli' ? 'none' : 'block';
  $p('pmail').parentNode.style.display = m === 'nouveau' ? 'none' : 'block';
  $p('poubli').style.display = m === 'connexion' ? '' : 'none';
  $p('pbasc').style.display = m === 'nouveau' ? 'none' : '';

function porteOccupe(v) { Porte.occupe = v; $p('pok').disabled = v; }
function entrer() {
  Compte.dedans = true;

async function inscription(email, mdp) {
  const r = await auth('/signup', { email, password: mdp, options: { email_redirect_to: location.origin + location.pathname } });

async function nouveauMdp(mdp) {
  const r = await auth('/user', { password: mdp }, Compte.jeton, 'PUT');

  if (Porte.occupe) return;

  if (Porte.mode !== 'nouveau' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { porteMsg('adresse e-mail invalide'); return; }
  if (Porte.mode !== 'oubli' && mdp.length < 8) { porteMsg('mot de passe : 8 caractères au moins'); return; }

  history.replaceState(null, '', location.pathname + location.search);   // on ne laisse pas traîner le jeton

  $p('pbasc').onclick = () => porteMode(Porte.mode === 'connexion' ? 'inscription' : 'connexion');
  $p('poubli').onclick = () => porteMode('oubli');
  porteMode('connexion');
  const venu = jetonDeLAdresse();
  if (venu && venu.erreur) { porteMsg(venu.erreur.replace(/\+/g, ' ')); return; }
  if (venu && venu.jeton) {
    Compte.jeton = venu.jeton; Compte.refresh = venu.refresh; Compte.exp = Date.now() + venu.exp * 1000;
    try {
      const u = await auth('/user', null, venu.jeton, 'GET');

    if (Compte.uid) { entrer(); return; }
  }
  const g = sessionGardee();
  if (g && g.jeton && g.uid) {
    Compte.jeton = g.jeton; Compte.refresh = g.refresh; Compte.exp = g.exp || 0;
    Compte.uid = g.uid; Compte.email = g.email || '';
    if (Date.now() < Compte.exp - 60000) { entrer(); return; }
    const j = await jetonValide();                       // périmé : on le renouvelle
    if (j) { entrer(); return; }
    porteMsg('session expirée : reconnectez-vous');
  }
}
